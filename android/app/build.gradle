plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
    id 'com.google.firebase.crashlytics'
}

def keystorePropertiesFile = rootProject.file('key.properties')
def keystoreProperties = new Properties()

android {
    compileSdkVersion flutter.compileSdkVersion
    ndkVersion "28.2.13676358"

    compileOptions {
        // Required by flutter_local_notifications (uses java.time APIs on
        // older Android via desugaring).
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    namespace = "cc.gambiapps.nossosmomentos"
    defaultConfig {
        minSdkVersion = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        // Required for core library desugaring (flutter_local_notifications).
        multiDexEnabled true
    }

    // if keystorePropertiesFile exists, load local keystore; CI uses env vars
    if (keystorePropertiesFile.exists()) {
        keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            } else {
                keyAlias System.getenv('CM_KEY_ALIAS') ?: System.getenv('CM_KEYSTORE_ALIAS')
                keyPassword System.getenv('CM_KEY_PASSWORD') ?: System.getenv('CM_KEYSTORE_PASSWORD')
                storeFile file(System.getenv('CM_KEYSTORE_PATH') ?: System.getenv('CM_ANDROID_KEYSTORE_PATH'))
                storePassword System.getenv('CM_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:30.0.2')
    implementation 'com.google.firebase:firebase-analytics-ktx'
    // Core library desugaring runtime (flutter_local_notifications).
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}
