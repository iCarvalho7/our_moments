workflows:
  firebase-distribution:
    name: Firebase App Distribution
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Flutter CI
    environment:
      android_signing:
        - upload
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: cc.gambiapps.nossosmomentos
      vars:
        GOOGLE_PLACES_API_KEY: changeme
      flutter: 3.44.1
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: never-match
          include: false
    scripts:
      - name: Set up Firebase service account
        script: |
          set -ex
          cp $FCI_BUILD_DIR/firebase-sa.json /tmp/firebase-sa.json
          python3 -c "import json; d=json.load(open('/tmp/firebase-sa.json')); print('JSON OK - project:', d['project_id'])"
      - name: Set up iOS signing
        script: |
          set -ex
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles
      - name: Inject dart defines
        script: |
          echo "GOOGLE_PLACES_API_KEY=$GOOGLE_PLACES_API_KEY" > dart_defines.txt
      - name: Install dependencies
        script: |
          flutter pub get
      - name: Build iOS
        script: |
          set -ex
          flutter config --no-enable-swift-package-manager
          rm -f ios/Podfile.lock
          flutter build ipa --release \
            --dart-define-from-file=dart_defines.txt \
            --build-name=1.1.5 \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
      - name: Build Android APK
        script: |
          flutter build apk --release \
            --dart-define-from-file=dart_defines.txt \
            --build-name=1.1.5 \
            --build-number=$BUILD_NUMBER
      - name: Build Android AAB
        script: |
          flutter build appbundle --release \
            --dart-define-from-file=dart_defines.txt \
            --build-name=1.1.5 \
            --build-number=$BUILD_NUMBER
      - name: Publish to Firebase App Distribution
        script: |
          set -ex
          npm install -g firebase-tools
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
          IPA=$(find build/ios/ipa -name "*.ipa" | head -1)
          APK=$(find build/app/outputs/flutter-apk -name "*.apk" | head -1)
          AAB=$(find build/app/outputs/bundle/release -name "*.aab" | head -1)
          firebase appdistribution:distribute "$IPA" \
            --app 1:258810302381:ios:90432b4f388901ab481b24 \
            --groups testers
          firebase appdistribution:distribute "$APK" \
            --app 1:258810302381:android:14a0ee32c7f504a6481b24 \
            --groups testers
          firebase appdistribution:distribute "$AAB" \
            --app 1:258810302381:android:14a0ee32c7f504a6481b24 \
            --groups testers
    artifacts:
      - build/ios/ipa/*.ipa
      - build/app/outputs/flutter-apk/app-release.apk
      - build/app/outputs/bundle/release/app-release.aab
