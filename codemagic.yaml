workflows:
  firebase-distribution:
    name: Firebase App Distribution
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: 3.44.1
      xcode: latest
      cocoapods: default
      vars:
        GOOGLE_PLACES_API_KEY: Encrypted(...)
      groups:
        - firebase_creds
        - apple_creds
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: never-match
          include: false
    scripts:
      - name: Set up iOS signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "cc.gambiapps.nossosmomentos" \
            --type IOS_APP_DEVELOPMENT \
            --create
          keychain add-certificates
      - name: Inject dart defines
        script: |
          echo "GOOGLE_PLACES_API_KEY=$GOOGLE_PLACES_API_KEY" > dart_defines.txt
      - name: Install dependencies
        script: |
          flutter pub get
      - name: Build Android APK
        script: |
          flutter build apk --release \
            --dart-define-from-file=dart_defines.txt \
            --build-name=1.1.5 \
            --build-number=$BUILD_NUMBER
      - name: Build Android AAB
        script: |
          flutter build appbundle --release \
            --dart-define-from-file=dart_defines.txt \
            --build-name=1.1.5 \
            --build-number=$BUILD_NUMBER
      - name: Build iOS
        script: |
          xcode-project use-magic-json
          flutter build ipa --release \
            --dart-define-from-file=dart_defines.txt \
            --build-name=1.1.5 \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=$CM_BUILD_DIR/ios/exportOptions.plist
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
      - build/app/outputs/bundle/release/app-release.aab
      - build/ios/ipa/*.ipa
    publishing:
      firebase:
        firebase_service_account: $FIREBASE_SERVICE_ACCOUNT
        android:
          app_id: 1:258810302381:android:14a0ee32c7f504a6481b24
          artifact_type: aab
        ios:
          app_id: 1:258810302381:ios:90432b4f388901ab481b24
