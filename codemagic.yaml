workflows:
  firebase-distribution:
    name: Firebase App Distribution
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: 3.44.1
      xcode: latest
      cocoapods: default
      vars:
        GOOGLE_PLACES_API_KEY: changeme
        FIREBASE_SERVICE_ACCOUNT: changeme
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: never-match
          include: false
    scripts:
      - name: Inject dart defines
        script: |
          echo "GOOGLE_PLACES_API_KEY=$GOOGLE_PLACES_API_KEY" > dart_defines.txt
      - name: Install dependencies
        script: |
          flutter pub get
      - name: Build Android APK
        script: |
          flutter build apk --release \
            --dart-define-from-file=dart_defines.txt \
            --build-name=1.1.5 \
            --build-number=$BUILD_NUMBER
      - name: Build Android AAB
        script: |
          flutter build appbundle --release \
            --dart-define-from-file=dart_defines.txt \
            --build-name=1.1.5 \
            --build-number=$BUILD_NUMBER
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
      - build/app/outputs/bundle/release/app-release.aab
    publishing:
      firebase:
        firebase_service_account: $FIREBASE_SERVICE_ACCOUNT
        android:
          app_id: 1:258810302381:android:14a0ee32c7f504a6481b24
          artifact_type: aab
